<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ClaimCheck architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f55"/>
    </marker>
    <style>
      .box { fill: #f7f7f5; stroke: #4a4f55; stroke-width: 1.2; }
      .group { fill: #eef2f6; stroke: #4a4f55; stroke-width: 1.2; }
      .stage { fill: #ffffff; stroke: #4a4f55; stroke-width: 1.2; }
      .inner { fill: #ffffff; stroke: #7a8088; stroke-width: 1; }
      .pill { fill: #ffffff; stroke: #7a8088; stroke-width: 1; }
      .t { font-size: 14.5px; font-weight: 600; fill: #1d1f21; }
      .s { font-size: 12px; fill: #3d4248; }
      .m { font-size: 12px; fill: #1d1f21; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .note { font-size: 11.5px; fill: #5b6168; }
      .edge { stroke: #4a4f55; stroke-width: 1.4; fill: none; }
      .c { text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <!-- Row 1: intake -->
  <rect class="box" x="20" y="24" width="190" height="64" rx="5"/>
  <text class="t c" x="115" y="51">Claim packet upload</text>
  <text class="s c" x="115" y="71">PDF and scanned images</text>

  <rect class="box" x="260" y="24" width="230" height="64" rx="5"/>
  <text class="t c" x="375" y="51">FastAPI service</text>
  <text class="s c" x="375" y="71">JWT roles · upload · review · /ask</text>

  <rect class="box" x="540" y="24" width="190" height="64" rx="5"/>
  <text class="t c" x="635" y="51">Job queue in Postgres</text>
  <text class="s c" x="635" y="71">SKIP LOCKED · 3 attempts</text>

  <line class="edge" x1="210" y1="56" x2="258" y2="56" marker-end="url(#arrow)"/>
  <line class="edge" x1="490" y1="56" x2="538" y2="56" marker-end="url(#arrow)"/>
  <line class="edge" x1="635" y1="88" x2="635" y2="128" marker-end="url(#arrow)"/>

  <!-- Row 2: the worker pipeline -->
  <rect class="group" x="20" y="130" width="710" height="156" rx="6"/>
  <text class="t" x="36" y="153">Worker: deterministic pipeline <tspan class="s" font-weight="400">(no LLM decides control flow)</tspan></text>

  <rect class="stage" x="36" y="168" width="150" height="76" rx="4"/>
  <text class="t c" x="111" y="194">OCR</text>
  <text class="s c" x="111" y="214">Tesseract</text>
  <text class="s c" x="111" y="230">per-word confidence</text>

  <rect class="stage" x="212" y="168" width="150" height="76" rx="4"/>
  <text class="t c" x="287" y="194">Classify</text>
  <text class="s c" x="287" y="214">embedding similarity</text>
  <text class="s c" x="287" y="230">LLM only if unsure</text>

  <rect class="stage" x="388" y="168" width="150" height="76" rx="4"/>
  <text class="t c" x="463" y="194">Extract</text>
  <text class="s c" x="463" y="214">schema-constrained</text>
  <text class="s c" x="463" y="230">LLM call + confidence</text>

  <rect class="stage" x="564" y="168" width="150" height="76" rx="4"/>
  <text class="t c" x="639" y="194">Validate</text>
  <text class="s c" x="639" y="214">7 cross-document rules</text>
  <text class="s c" x="639" y="230">no LLM</text>

  <line class="edge" x1="186" y1="206" x2="210" y2="206" marker-end="url(#arrow)"/>
  <line class="edge" x1="362" y1="206" x2="386" y2="206" marker-end="url(#arrow)"/>
  <line class="edge" x1="538" y1="206" x2="562" y2="206" marker-end="url(#arrow)"/>

  <!-- LLM gateway -->
  <rect class="box" x="800" y="24" width="180" height="248" rx="5"/>
  <text class="t c" x="890" y="51">LLM gateway</text>
  <text class="m c" x="890" y="72">LLM_BACKEND =</text>
  <rect class="pill" x="815" y="84" width="150" height="24" rx="12"/>
  <text class="m c" x="890" y="100">anthropic</text>
  <rect class="pill" x="815" y="114" width="150" height="24" rx="12"/>
  <text class="m c" x="890" y="130">openai</text>
  <rect class="pill" x="815" y="144" width="150" height="24" rx="12"/>
  <text class="m c" x="890" y="160">ollama (local)</text>
  <text class="s c" x="890" y="192">cloud backends receive</text>
  <text class="s c" x="890" y="208">names and ID numbers</text>
  <text class="s c" x="890" y="224">redacted; raw text only local</text>
  <text class="note c" x="890" y="252">replay cassettes: CI, demo</text>

  <path class="edge" d="M463,244 V262 H798" marker-end="url(#arrow)"/>
  <path class="edge" d="M287,244 V262 H463"/>
  <text class="note" x="300" y="279">model calls: classify fallback, extract</text>

  <!-- Row 3: storage, review file, agent -->
  <line class="edge" x1="185" y1="286" x2="185" y2="318" marker-end="url(#arrow)"/>
  <text class="note" x="195" y="306">reads the policy version in force, writes verdicts with evidence</text>

  <rect class="box" x="20" y="320" width="330" height="230" rx="5"/>
  <text class="t" x="36" y="345">Postgres (source of truth)</text>
  <text class="s" x="36" y="369">policies and dated versions, never deleted</text>
  <text class="s" x="36" y="389">claims, documents, fields, rule verdicts</text>
  <text class="s" x="36" y="409">jobs, append-only audit_log</text>
  <text class="s" x="36" y="429">row-level security per role</text>
  <rect class="inner" x="36" y="446" width="298" height="88" rx="4"/>
  <text class="t" x="50" y="470">pgvector</text>
  <text class="s" x="50" y="490">clause embeddings (local bge-small)</text>
  <text class="s" x="50" y="510">searched only within the version</text>
  <text class="s" x="50" y="526">in force on the incident date</text>

  <rect class="box" x="400" y="320" width="200" height="76" rx="5"/>
  <text class="t c" x="500" y="345">Decision-ready file</text>
  <text class="s c" x="500" y="365">per-claim review JSON</text>
  <text class="s c" x="500" y="381">every verdict with evidence</text>
  <line class="edge" x1="350" y1="358" x2="398" y2="358" marker-end="url(#arrow)"/>

  <rect class="box" x="400" y="432" width="200" height="72" rx="5"/>
  <text class="t c" x="500" y="457">Review UI (React)</text>
  <text class="s c" x="500" y="477">verdicts, evidence, questions,</text>
  <text class="s c" x="500" y="493">approve or reject</text>
  <line class="edge" x1="500" y1="396" x2="500" y2="430" marker-end="url(#arrow)"/>

  <rect class="box" x="800" y="320" width="180" height="92" rx="5"/>
  <text class="t c" x="890" y="345">Adjuster Q&amp;A agent</text>
  <text class="s c" x="890" y="365">one loop, at most 6 turns</text>
  <text class="s c" x="890" y="381">citations checked in code</text>
  <text class="note c" x="890" y="400">adjusters only</text>
  <line class="edge" x1="890" y1="318" x2="890" y2="274" marker-end="url(#arrow)"/>
  <text class="note" x="898" y="300">chat, tool calls</text>

  <rect class="box" x="800" y="450" width="180" height="100" rx="5"/>
  <text class="t c" x="890" y="475">MCP tool server</text>
  <text class="s c" x="890" y="495">allowlist of 7 tools</text>
  <text class="s c" x="890" y="511">read-only, except</text>
  <text class="s c" x="890" y="527">flag_for_review, which</text>
  <text class="s c" x="890" y="543">a person must confirm</text>
  <line class="edge" x1="890" y1="414" x2="890" y2="448" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line class="edge" x1="798" y1="532" x2="352" y2="532" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="note c" x="680" y="524">claim data, version-filtered clauses</text>

  <!-- FastAPI hands /ask to the agent; drawn last so it bridges the model-call line -->
  <path d="M450,24 V12 H768 V366 H798" fill="none" stroke="#ffffff" stroke-width="7"/>
  <path class="edge" d="M450,24 V12 H768 V366 H798" marker-end="url(#arrow)"/>
  <text class="note" x="760" y="358" text-anchor="end">POST /ask</text>

  <text class="note" x="20" y="584">Each packet is one OpenTelemetry trace (exported to Jaeger): a span per stage, and an llm.call span per model call with model, tokens, cost and latency.</text>
</svg>
