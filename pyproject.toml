[project]
name = "claimcheck"
version = "0.1.0"
description = "Insurance claim intake with document AI: validates a claim packet against the policy version in force."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aymane Belarbi" }]
keywords = ["document-ai", "insurance", "llm", "rag", "mcp", "evals", "fastapi", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.156.4",
    "fastembed>=0.2.7",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/AymaneBelarbi/ClaimCheck"
Issues = "https://github.com/AymaneBelarbi/ClaimCheck/issues"
Changelog = "https://github.com/AymaneBelarbi/ClaimCheck/blob/main/CHANGELOG.md"

[dependency-groups]
# Only `make dataset` (evals/dataset/) and a few tests that build PDFs need these; the
# application image is installed without them.
dataset = [
    "faker>=40.43.0",
    "reportlab>=5.0.1",
]
dev = [
    # starlette.testclient imports it; nothing in the code does.
    "httpx2>=2.15.1",
    "mypy>=1.13",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "types-reportlab>=5.0.0.20261008",
]

[tool.uv]
# Host commands (`uv sync`, `uv run`) get the dataset generator and the dev tools.
default-groups = ["dataset", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package; claimcheck.core holds settings and shared types and every other subpackage
# imports it. evals/ stays out of the wheel: it imports claimcheck, never the other way round.
packages = ["src/claimcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["claimcheck", "evals"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow'"
pythonpath = ["src", "."]
markers = [
    "db: needs a running Postgres (TEST_DATABASE_URL)",
    "ocr: needs the tesseract binary on PATH",
    "slow: downloads or loads the embedding model; run with -m slow",
]

[[tool.mypy.overrides]]
# None of these libraries ships type information.
module = ["pypdfium2", "pypdfium2.*", "pytesseract", "fastembed", "fastembed.*"]
ignore_missing_imports = true
