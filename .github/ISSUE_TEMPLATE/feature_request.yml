name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an adjuster or a developer cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change, and which mechanism fits (deterministic code, retrieval or the agent).
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How we would know it works
      description: The eval stage or metric that should move, or the test that would cover it.
